<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Adventurers' Guild Hall</title><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#12131a;color:#f8e6c0;font:15px system-ui;touch-action:none}canvas{display:block}#loading{position:absolute;inset:0;display:grid;place-content:center;text-align:center;background:#14151c;z-index:10;padding:24px}#loading small{margin-top:12px;color:#c4b7a4}#hud{position:absolute;top:env(safe-area-inset-top,12px);left:12px;z-index:3;text-shadow:0 2px 3px #000}#hint{font-size:12px;opacity:.8}#joystick{position:absolute;left:25px;bottom:calc(30px + env(safe-area-inset-bottom));width:126px;height:126px;border:2px solid #f5dcad88;border-radius:50%;background:#ffffff17;touch-action:none;z-index:4}#knob{position:absolute;width:56px;height:56px;left:35px;top:35px;border-radius:50%;background:#e6c48d99;border:2px solid #fff6}#look{position:absolute;right:0;top:0;width:55%;height:100%;z-index:2;touch-action:none}#jump{position:absolute;right:25px;bottom:calc(42px + env(safe-area-inset-bottom));z-index:5;background:#3c322ac9;color:white;border:1px solid #e6c48d;border-radius:50%;width:72px;height:72px;font-weight:bold}#crosshair{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);opacity:.6;pointer-events:none}#error{color:#ffb4a4;max-width:460px}
</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"}}</script></head><body>
<div id="loading"><h2>Adventurers' Guild Hall</h2><div id="status">Loading your guild hall…</div><small>First launch needs an internet connection.</small><div id="error"></div></div>
<div id="hud"><b>⚔️ Adventurers' Guild</b><div id="hint">Left thumb: move · Right thumb: look · Jump button<br>Desktop: WASD, mouse drag, Space</div></div><div id="look"></div><div id="crosshair">+</div><div id="joystick"><div id="knob"></div></div><button id="jump">JUMP</button>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {Octree} from 'three/addons/math/Octree.js';
import {Capsule} from 'three/addons/math/Capsule.js';
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.25;document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color('#16171c');scene.add(new THREE.HemisphereLight(0xffe3b6,0x52617c,2.2));
const lamp=(x,y,z,power,range,color)=>{const l=new THREE.PointLight(color,power,range,2);l.position.set(x,y,z);scene.add(l)};lamp(0,5,0,350,17,0xffba70);lamp(0,2.8,8,180,9,0xff6c2e);lamp(6,3,0,130,9,0xffc58a);lamp(-6,3,0,110,9,0xffc58a);
const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.07,130);const world=new Octree();const player=new Capsule(new THREE.Vector3(0,.4,-7),new THREE.Vector3(0,1.65,-7),.35);let grounded=false;const vel=new THREE.Vector3();let yaw=0,pitch=0,ready=false;const keys={};const joy={x:0,y:0};let jumping=false;
const loading=document.querySelector('#loading'),status=document.querySelector('#status'),error=document.querySelector('#error');
new GLTFLoader().load('./adventurers_guild.blend.glb',g=>{scene.add(g.scene);g.scene.updateMatrixWorld(true);world.fromGraphNode(g.scene);ready=true;loading.style.display='none';},p=>{if(p.total)status.textContent='Loading guild hall: '+Math.round(p.loaded/p.total*100)+'%';},e=>{status.textContent='Unable to open the 3D model.';error.textContent='Check that index.html and adventurers_guild.blend.glb are in the same folder on a web server. '+e.message;});
function collide(){const hit=world.capsuleIntersect(player);grounded=false;if(hit){grounded=hit.normal.y>.5;if(!grounded)vel.addScaledVector(hit.normal,-hit.normal.dot(vel));else if(vel.y<0)vel.y=0;player.translate(hit.normal.multiplyScalar(hit.depth));}}
function move(dt){if(!ready)return;const forward=(keys.KeyW?1:0)-(keys.KeyS?1:0)-joy.y;const sideways=(keys.KeyD?1:0)-(keys.KeyA?1:0)+joy.x;const v=new THREE.Vector3(sideways,0,-forward);if(v.lengthSq()>1)v.normalize();v.applyAxisAngle(new THREE.Vector3(0,1,0),yaw);player.translate(v.multiplyScalar(dt*3));vel.y-=18*dt;if((keys.Space||jumping)&&grounded){vel.y=6;grounded=false;}player.translate(new THREE.Vector3(0,vel.y*dt,0));collide();if(player.end.y < -5){player.start.set(0,.4,-7);player.end.set(0,1.65,-7);vel.set(0,0,0)}camera.position.copy(player.end);camera.rotation.order='YXZ';camera.rotation.set(pitch,yaw,0);}
let last=performance.now();function animate(now){requestAnimationFrame(animate);const dt=Math.min((now-last)/1000,.035);last=now;move(dt);renderer.render(scene,camera)}requestAnimationFrame(animate);
const look=document.querySelector('#look');let lastTouch=null;look.addEventListener('pointerdown',e=>{look.setPointerCapture(e.pointerId);lastTouch=[e.clientX,e.clientY]});look.addEventListener('pointermove',e=>{if(!lastTouch)return;const dx=e.clientX-lastTouch[0],dy=e.clientY-lastTouch[1];yaw-=dx*.004;pitch=Math.max(-1.48,Math.min(1.48,pitch-dy*.004));lastTouch=[e.clientX,e.clientY]});for(const ev of ['pointerup','pointercancel'])look.addEventListener(ev,()=>lastTouch=null);
const stick=document.querySelector('#joystick'),knob=document.querySelector('#knob');function setJoy(e){const r=stick.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),len=Math.max(1,Math.hypot(dx,dy)),f=Math.min(1,54/len);joy.x=dx*f/54;joy.y=dy*f/54;knob.style.transform=`translate(${joy.x*54}px,${joy.y*54}px)`;}stick.addEventListener('pointerdown',e=>{stick.setPointerCapture(e.pointerId);setJoy(e)});stick.addEventListener('pointermove',e=>{if(stick.hasPointerCapture(e.pointerId))setJoy(e)});for(const ev of ['pointerup','pointercancel'])stick.addEventListener(ev,()=>{joy.x=joy.y=0;knob.style.transform=''});
const jb=document.querySelector('#jump');jb.addEventListener('pointerdown',e=>{jb.setPointerCapture(e.pointerId);jumping=true});for(const ev of ['pointerup','pointercancel'])jb.addEventListener(ev,()=>jumping=false);
window.addEventListener('keydown',e=>{keys[e.code]=true;if(['Space','ArrowUp','ArrowDown'].includes(e.code))e.preventDefault()});window.addEventListener('keyup',e=>keys[e.code]=false);window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
